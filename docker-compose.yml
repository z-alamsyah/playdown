# Self-hosted Playdown landing page.
#
# One-time: cp .env.example .env && edit DOCKERHUB_USER.
# Build + push (from this repo):   docker compose build && docker compose push
# Run on the server (e.g. Jetson): docker compose up -d   (or:
#   docker run -d --restart unless-stopped -p 8080:80 <user>/playdown-site:latest)
services:
  site:
    image: ${DOCKERHUB_USER:?Set DOCKERHUB_USER in .env}/playdown-site:${TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${SITE_PORT:-8080}:80"
    restart: unless-stopped
